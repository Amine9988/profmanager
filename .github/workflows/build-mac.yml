name: Build Mac

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-electron.js
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build DMG / ZIP (mac)
        run: npx electron-builder --mac --x64 --arm64
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish to R2 (permanent auto-update)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: node scripts/publish-r2-mac.js
      - uses: actions/upload-artifact@v4
        with:
          name: ProfManager-Mac-${{ github.ref_name }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.blockmap
            electron/dist/latest-mac.yml
