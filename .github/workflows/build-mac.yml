name: Build Mac

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Prepare standalone server
        run: node scripts/build-electron.js
        env:
          CI: "false"
          STANDALONE_ONLY: "1"
      - name: Fetch Darwin platform-tools
        run: node scripts/fetch-mac-platform-tools.js
      - name: Verify standalone tree
        run: |
          test -f electron/standalone-server/server.js
          test -d electron/standalone-server/node_modules
          echo "standalone ok"
      - name: Install Electron app toolchain
        working-directory: electron
        run: |
          chmod +x install-mac.command
          if [ ! -f public/icon.icns ]; then
            mkdir -p /tmp/pm.iconset
            for s in 16 32 64 128 256 512; do
              sips -z $s $s public/icon.png --out /tmp/pm.iconset/icon_${s}x${s}.png >/dev/null
              ds=$((s*2))
              sips -z $ds $ds public/icon.png --out /tmp/pm.iconset/icon_${s}x${s}@2x.png >/dev/null
            done
            iconutil -c icns /tmp/pm.iconset -o public/icon.icns
          fi
          test -f public/icon.icns
          test -f public/icon.png
          npm install --no-fund --no-audit
          node ../scripts/make-dmg-background.js
          test -f public/dmg-background.png
      - name: Build DMG
        working-directory: electron
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.CSC_KEY_PASSWORD }}"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_APP_SPECIFIC_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          ./node_modules/.bin/electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CI: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: electron/dist
          merge-multiple: true
          pattern: dmg-*
      - name: Require at least one DMG
        run: |
          python3 - <<'PY'
          import os, sys
          dist = "electron/dist"
          files = []
          for root, _, names in os.walk(dist):
            files += [os.path.join(root, n) for n in names if n.lower().endswith(".dmg")]
          print("\n".join(files) or "none")
          if not files:
            sys.exit("No DMG artifacts downloaded")
          PY
      - name: Merge latest-mac.yml
        run: node scripts/merge-mac-channel.js electron/dist
      - name: Install R2 client
        run: npm install @aws-sdk/client-s3 --no-save --no-fund --no-audit
      - name: Publish to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: node scripts/publish-r2-mac.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProfManager-Mac-${{ github.run_id }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.blockmap
            electron/dist/latest-mac.yml
