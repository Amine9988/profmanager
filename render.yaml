services:
  - type: web
    name: profmanager-web
    runtime: node
    plan: free
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.9 --activate
      pnpm install --frozen-lockfile
      pnpm run build:render
    startCommand: node .next/standalone/server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_APP_NAME
        value: ProfManager
